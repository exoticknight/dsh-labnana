name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify build artifacts
        run: |
          test -f lib/index.js && echo "host ESM ok"
          test -f lib/client.js && echo "client factory ok"
          node --check lib/index.js
      - name: Verify committed lib/ is fresh
        run: |
          git diff --exit-code -- lib/ || {
            echo "::error::lib/ is stale — run 'npm run build' and commit the rebuilt artifacts"
            exit 1
          }
