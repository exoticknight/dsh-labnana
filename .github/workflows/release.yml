name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version v$package_version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify build artifacts
        run: |
          test -f lib/index.js && echo "host ESM ok"
          test -f lib/client.js && echo "client factory ok"
          node --check lib/index.js
      - name: Pack prebuilt tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Publish to npm
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published; skipping npm publish"
          else
            npm publish --access public
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lib/index.js
            lib/client.js
            cordis.patch.yml
            package.json
            README.md
            LICENSE
            dist/*.tgz
