name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify build artifacts
        run: |
          test -f lib/index.js && echo "host ESM ok"
          test -f lib/client.js && echo "client factory ok"
          node --check lib/index.js
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lib/index.js
            lib/client.js
            cordis.patch.yml
            package.json
            README.md
            LICENSE
